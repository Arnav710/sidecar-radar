apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "sidecar"
            - name: WORKER_URL
              value: "http://worker"
            - name: OTEL_SERVICE_NAME
              value: "sidecar-web"
          # ES_URL, ES_API_KEY, OPENAI_API_KEY, DASH0_AUTH_TOKEN and
          # OTEL_EXPORTER_OTLP_ENDPOINT come from a Secret a human creates
          # (never in git). optional: the app still starts before it exists.
          envFrom:
            - secretRef:
                name: app-credentials
                optional: true
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
